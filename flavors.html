<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Six easy flavor variations built from one brownie recipe.">
    <title>Brownie Flavors | Brownie Club</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="site-header">
    <a class="brand" href="index.html" aria-label="Brownie Club home">
        <span class="brand-mark">🍫</span>
        <span>Brownie Club</span>
    </a>
    <button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="recipe.html">Recipe</a>
        <a href="flavors.html">Flavors</a>
        <a href="timer.html">Timer</a>
        <a href="game.html">Game</a>
        <a href="about.html">About</a>
    </nav>
    <button class="sound-button" type="button" aria-label="Toggle sounds" title="Toggle sounds">🔊</button>
</header>

<main class="page-main">
    <section class="page-intro section-shell reveal">
        <p class="eyebrow">Same batter, new mood</p>
        <h1>Flavors</h1>
        <p>Choose a card to reveal the one change that takes the base recipe somewhere new.</p>
    </section>

    <section class="flavor-grid section-shell">
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">☕</span>
            <span class="flavor-meta">Deep and grown-up</span>
            <strong>Salted Espresso</strong>
            <span class="flavor-detail">Add 1 teaspoon instant espresso with the cocoa, then finish with flaky salt.</span>
            <span class="flavor-action">View change +</span>
        </button>
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">🥜</span>
            <span class="flavor-meta">Nutty and savory</span>
            <strong>Tahini Swirl</strong>
            <span class="flavor-detail">Dollop 3 tablespoons tahini on top and drag a knife through the batter twice.</span>
            <span class="flavor-action">View change +</span>
        </button>
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">🧈</span>
            <span class="flavor-meta">Toffee-adjacent</span>
            <strong>Browned Butter</strong>
            <span class="flavor-detail">Brown the butter until it smells nutty, then let it cool for 5 minutes before mixing.</span>
            <span class="flavor-action">View change +</span>
        </button>
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">🍫</span>
            <span class="flavor-meta">Maximum commitment</span>
            <strong>Triple Chocolate</strong>
            <span class="flavor-detail">Fold in 1/2 cup each of dark and white chocolate chunks before baking.</span>
            <span class="flavor-action">View change +</span>
        </button>
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">🌶️</span>
            <span class="flavor-meta">Warm finish</span>
            <strong>Chili Cinnamon</strong>
            <span class="flavor-detail">Add 1/2 teaspoon cinnamon and a small pinch of cayenne with the dry ingredients.</span>
            <span class="flavor-action">View change +</span>
        </button>
        <button class="flavor-card reveal" type="button" aria-expanded="false">
            <span class="flavor-icon">🍊</span>
            <span class="flavor-meta">Bright and clean</span>
            <strong>Orange Zest</strong>
            <span class="flavor-detail">Rub the zest of one orange into the sugar before adding the melted butter.</span>
            <span class="flavor-action">View change +</span>
        </button>
    </section>

    <section class="closing-banner">
        <p>Pick one. Do not add all six.</p>
        <a class="button button-light" href="recipe.html">Back to the recipe</a>
    </section>
</main>

<footer class="site-footer">
    <strong>Brownies &gt; Cookies</strong>
    <span>Baked slowly, on purpose.</span>
</footer>

</body>
</html>
